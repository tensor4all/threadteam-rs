[package]
name = "threadteam"
version = "0.6.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Satoshi Terasaki", "Hiroshi Shinaoka"]
repository = "https://github.com/tensor4all/threadteam-rs"
readme = "README.md"
documentation = "https://docs.rs/threadteam"
description = "OpenMP-style thread teams and CPU placement for HPC in Rust: barrier-capable teams, participant pinning, libgomp-style waits and cost-based widths behind a splittable, non-Clone Exec token; no scheduler type in the public API."
keywords = ["hpc", "openmp", "parallel", "thread-pool", "affinity"]
categories = ["concurrency", "science"]

[features]
default = ["parallel"]
# Run entries on a private Rayon pool. Without it the same types exist, every
# pool has width 1 and every entry runs inline on the calling thread.
parallel = ["dep:rayon"]
# Test support: per-root live-task ledger and entry counters. Zero cost when off.
ledger = []
# Test support: hooks that pause threads inside the park/wake handshake and
# deliberate protocol breakages (see `test_hooks`). Zero cost when off.
test-hooks = []
# Test support: a ring of timestamped state transitions per reserved member
# (see `trace`). Zero cost when off.
trace = []

[dependencies]
rayon = { version = "1.10", optional = true }
thiserror = "1.0"

[lib]
bench = false

[target.'cfg(loom)'.dependencies]
loom = "0.7"

# Worker QoS (`pthread_set_qos_class_self_np`).
[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"

# Participant placement (`sched_getaffinity` / `sched_setaffinity`).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
libc = "0.2"

[[bench]]
name = "team_dispatch"
harness = false

[[bench]]
name = "dispatch_cost"
harness = false
required-features = ["parallel"]

[[bench]]
name = "wake_probe"
harness = false

[[bench]]
name = "idle_trace"
harness = false
required-features = ["trace", "parallel"]

[[bench]]
name = "spin_grid"
harness = false
required-features = ["parallel"]

[[test]]
name = "idle_clock"
required-features = ["trace", "parallel"]

[[test]]
name = "team_hooks"
required-features = ["test-hooks", "parallel"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[[bench]]
name = "cost_lookup"
harness = false

[[bench]]
name = "wait_scenarios"
harness = false
required-features = ["parallel"]

[[bench]]
name = "resident_split"
harness = false
required-features = ["parallel"]

[[bench]]
name = "foreign_entry"
harness = false
required-features = ["parallel"]

# No default profile carries debug info (tensor4all-agent-rules, rules/rust/performance.md,
# "Build Profiles And Target Hygiene"); `debug-assertions` and `overflow-checks` stay on.
[profile.dev]
debug = 0
debug-assertions = true
overflow-checks = true

[profile.test]
debug = 0
debug-assertions = true
overflow-checks = true

# CI builds and tests with this profile (tensor4all-agent-rules, rules/common/repository.md,
# "Build Profiles"). It inherits `test`, not `release`: the work split and the team's budget
# arithmetic state their invariants as `debug_assert!`s (`src/split.rs`), the park/wake and
# participant code is `unsafe` concurrency, and the standard library's unsafe-precondition checks
# and integer overflow checks only run with `debug-assertions` and `overflow-checks` on. The loom
# job keeps its own `--release`.
[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"
